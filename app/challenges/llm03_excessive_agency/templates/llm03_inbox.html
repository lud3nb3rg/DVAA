<table>
  <thead><tr><th style="width:3rem">#</th><th>From</th><th>Subject</th></tr></thead>
  <tbody>
    {% for e in emails %}
      <tr>
        <td class="mono">{{ e.id }}</td>
        <td class="small">
          {{ e.sender }}
          {% if e.from_player %}<span class="badge badge-solved">yours</span>{% endif %}
        </td>
        <td>
          {{ e.subject }}
          {% if e.folder == 'sent' %}<span class="badge badge-medium">sent</span>{% endif %}
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
<p class="small dim" style="margin-bottom:0">
  The assistant reads all of this while acting for the user. Anything you
  deliver here is read on the same footing as the rest.
</p>
