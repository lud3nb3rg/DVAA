[project]
name = "dvaa"
version = "0.1.0"
description = "Damn Vulnerable AI Agent - a deliberately vulnerable teaching lab for the OWASP GenAI/LLM Top 10 (2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "httpx>=0.27.0",
    "markdown-it-py>=3.0.0",
    "bleach>=6.2.0",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.5.0",
]
cloud = [
    "anthropic>=0.39.0",
    "openai>=1.54.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Deliberately vulnerable code lives in app/challenges - do not lint away the bugs.
ignore = ["B008", "E501"]
